name: Relatório semanal por e-mail

# Toda sexta às 18h de Brasília (UTC-3, sem horário de verão): 21h em UTC.
# O GitHub pode atrasar execuções agendadas em alguns minutos nos horários de pico.
on:
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Enviar só para o destinatário de teste (desmarque para enviar a todos)'
        type: boolean
        default: true
      guardar_pdfs:
        description: 'Guardar os PDFs na execução por 1 dia, só para conferir (o repositório é público: deixe desmarcado, salvo no teste)'
        type: boolean
        default: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automacao/relatorio-semanal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Atualizar com o Tiny, gerar os relatórios e enviar o e-mail
        run: node relatorio-semanal.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELATORIO_DESTINOS: ${{ vars.RELATORIO_DESTINOS || secrets.RELATORIO_DESTINOS }}
          RELATORIO_COPIA: ${{ vars.RELATORIO_COPIA || secrets.RELATORIO_COPIA }}
          RELATORIO_TESTE_DESTINO: ${{ vars.RELATORIO_TESTE_DESTINO || secrets.RELATORIO_TESTE_DESTINO }}
          MODO_TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste || 'false' }}

      # Os PDFs têm dados da operação e este repositório é público: só são guardados se
      # alguém marcar "guardar_pdfs" ao rodar à mão, e por apenas 1 dia. Nas execuções
      # agendadas de sexta nada fica guardado.
      - name: Guardar os PDFs (só se pedido)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.guardar_pdfs
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-pdf
          path: automacao/relatorio-semanal/pdfs/*.pdf
          retention-days: 1
          if-no-files-found: ignore
